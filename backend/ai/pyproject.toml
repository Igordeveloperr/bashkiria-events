[project]
name = "bashkiria-ai"
version = "0.1.0"
description = "GigaChat + LangGraph + Langfuse for Bashkiria events"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-gigachat>=0.5,<1",
    "langfuse==5.2.0",
    "langgraph>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv==1.2.4",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "alembic>=1.20,<2",
    "httpx>=0.28,<1",
    "sqlalchemy>=2,<3",
]

[tool.uv]
package = false
