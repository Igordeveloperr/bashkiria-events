# Keep the project name so moving this file preserves the existing database volume.
name: bashkiria-events

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bashkiria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bashkiria}
      POSTGRES_DB: ${POSTGRES_DB:-bashkiria}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - backend

  migrate:
    build:
      context: ./backend/db
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bashkiria}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bashkiria}
      PGDATABASE: ${POSTGRES_DB:-bashkiria}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  parser:
    profiles: ["parser"]
    build:
      context: ./backend/parser
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bashkiria}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bashkiria}
      PGDATABASE: ${POSTGRES_DB:-bashkiria}
      Parser__ApiKey: ${PARSER_API_KEY:-}
      Parser__SchedulerEnabled: ${PARSER_SCHEDULER_ENABLED:-true}
    ports:
      - "127.0.0.1:${PARSER_HTTP_PORT:-5164}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend

  searcher:
    build:
      context: ./backend/searcher
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bashkiria}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bashkiria}
      PGDATABASE: ${POSTGRES_DB:-bashkiria}
    ports:
      - "127.0.0.1:${SEARCHER_HTTP_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.50.0/24
          gateway: 172.28.50.1

volumes:
  postgres_data:
